global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# --- Resolveur DNS interne de Docker : evite l'echec au demarrage ---
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# --- Frontend : point d'entree du trafic ---
frontend http_front
    bind *:80
    default_backend web_servers

# --- Backend : pool des serveurs applicatifs ---
backend web_servers
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server web1 web1:80 check inter 3s fall 3 rise 2 resolvers docker init-addr last,libc,none
    server web2 web2:80 check inter 3s fall 3 rise 2 resolvers docker init-addr last,libc,none
    server web3 web3:80 check inter 3s fall 3 rise 2 resolvers docker init-addr last,libc,none

# --- Statistiques + exporteur Prometheus ---
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    http-request use-service prometheus-exporter if { path /metrics }
